<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 700" width="420" height="700">
  <defs>
    <linearGradient id="waTopBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#075e54"/>
      <stop offset="100%" stop-color="#128c7e"/>
    </linearGradient>
    <filter id="msgShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Telefon Ekranı / Sohbet Arka Planı -->
  <rect width="420" height="700" fill="#efeae2"/>
  
  <!-- WhatsApp Üst Durum & Kişi Barı -->
  <rect width="420" height="70" fill="url(#waTopBar)"/>
  <circle cx="35" cy="38" r="18" fill="#ffffff" opacity="0.2"/>
  <circle cx="35" cy="38" r="16" fill="#cbd5e1"/>
  <text x="35" y="43" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">KI</text>
  <text x="65" y="34" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Könül İsaq</text>
  <text x="65" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">+994 55 284 39 11</text>

  <!-- Müşteri Mesaj Balonu: 1. Karl Lagerfeld Çantası -->
  <g filter="url(#msgShadow)" transform="translate(20, 90)">
    <rect width="320" height="240" rx="12" fill="#ffffff"/>
    <!-- Ürün Fotoğraf Önizleme -->
    <rect x="8" y="8" width="304" height="150" rx="8" fill="#f1f5f9"/>
    <!-- Küçük Çanta İllüstrasyonu -->
    <rect x="110" y="45" width="100" height="75" rx="10" fill="#18181b"/>
    <path d="M 125 45 C 125 20, 195 20, 195 45" fill="none" stroke="#27272a" stroke-width="6"/>
    <rect x="145" y="80" width="30" height="18" rx="2" fill="#e2e8f0"/>
    <text x="160" y="145" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">Karl Lagerfeld Crossbody (125 AZN)</text>
    <text x="14" y="175" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Salam, zəhmət olmasa bu çantadan sifariş verin.</text>
    <text x="14" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Karl Lagerfeld 125 azn. Nəcəf Nərimanov 97</text>
    <text x="280" y="225" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">15:54</text>
  </g>

  <!-- Müşteri Mesaj Balonu: 2. Çanta ve Özel Talimat -->
  <g filter="url(#msgShadow)" transform="translate(20, 350)">
    <rect width="340" height="250" rx="12" fill="#ffffff"/>
    <rect x="8" y="8" width="324" height="150" rx="8" fill="#f8fafc"/>
    <!-- Küçük 2. Çanta İllüstrasyonu -->
    <path d="M 130 55 L 210 55 L 200 120 L 140 120 Z" fill="#09090b"/>
    <path d="M 145 55 C 145 30, 195 30, 195 55" fill="none" stroke="#27272a" stroke-width="5"/>
    <text x="170" y="145" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">Karl Lagerfeld Chain Tote (138 AZN)</text>
    
    <text x="14" y="176" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">⚠️ XÜSUSİ TƏLİMAT:</text>
    <text x="14" y="196" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#1e293b">"Bakıya çatanda xəbər edilsin sürücümüz</text>
    <text x="14" y="213" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#1e293b">özü gedib götürəcək"</text>
    <text x="300" y="238" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">15:56</text>
  </g>
</svg>
