<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="leatherToteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="60%" stop-color="#0f0e0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="goldChainGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="dropShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="500" height="500" fill="url(#bgGrad2)"/>
  
  <!-- Zemin Gölgesi -->
  <ellipse cx="250" cy="425" rx="165" ry="18" fill="#94a3b8" opacity="0.4" filter="blur(8px)"/>
  
  <g filter="url(#dropShadow2)">
    <!-- Çift Tutma Kulbu (Dual Tote Handles) -->
    <path d="M 180 200 C 180 100, 220 100, 220 200" fill="none" stroke="#262626" stroke-width="12" stroke-linecap="round"/>
    <path d="M 280 200 C 280 100, 320 100, 320 200" fill="none" stroke="#262626" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Altın Zincir Aksesuarı -->
    <path d="M 170 230 Q 250 310 330 230" fill="none" stroke="url(#goldChainGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="10,4"/>

    <!-- Tote Çanta Gövdesi (Trapezoid / Genişleyen Tote) -->
    <path d="M 140 200 L 360 200 L 340 390 C 338 400, 325 405, 310 405 L 190 405 C 175 405, 162 400, 160 390 Z" fill="url(#leatherToteGrad)"/>

    <!-- Çanta Dikiş Detayı -->
    <path d="M 148 206 L 352 206 L 333 388 C 332 396, 321 400, 308 400 L 192 400 C 179 400, 168 396, 167 388 Z" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Karl Lagerfeld Altın Kabartma Logo -->
    <rect x="205" y="270" width="90" height="24" rx="4" fill="#18181b" stroke="url(#goldChainGrad)" stroke-width="1"/>
    <text x="250" y="286" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="url(#goldChainGrad)" text-anchor="middle" letter-spacing="2">KARL</text>
  </g>

  <!-- Marka İmzası -->
  <g transform="translate(250, 460)">
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#1e293b" letter-spacing="3">KARL LAGERFELD</text>
    <text y="14" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="1">CHAIN TOTE • 138 AZN</text>
  </g>
</svg>
