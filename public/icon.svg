<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="parcelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glowT" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="14" y="14" width="484" height="484" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Global Route Coordinate Rings -->
  <circle cx="256" cy="220" r="150" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="256" cy="220" r="120" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />

  <!-- Orbiting Parcel Dot -->
  <circle cx="376" cy="220" r="7" fill="#38bdf8" />
  <circle cx="376" cy="220" r="14" fill="#38bdf8" fill-opacity="0.25" />

  <!-- Modern Futuristic "T" Monogram with Wings / Route Vector -->
  <g filter="url(#glowT)" transform="translate(0, -10)">
    <!-- Horizontal Crossbar of "T" with Beveled Edges -->
    <path d="M 145 130 
             L 367 130 
             C 375 130, 382 136, 380 144
             L 365 185 
             C 362 192, 355 198, 347 198 
             L 288 198 
             L 288 325 
             C 288 335, 278 345, 268 345 
             L 244 345 
             C 234 345, 224 335, 224 325 
             L 224 198 
             L 165 198 
             C 157 198, 150 192, 147 185 
             L 132 144 
             C 130 136, 137 130, 145 130 Z" 
          fill="url(#tGrad)" />

    <!-- Center Dynamic Flow Notch / Parcel Accent -->
    <path d="M 238 142 L 274 142 L 256 168 Z" fill="#ffffff" fill-opacity="0.9" />
    <!-- Global Route Arrow Line through base -->
    <path d="M 190 310 L 256 270 L 322 310" fill="none" stroke="url(#parcelGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: Brand Logotype -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="8">
    TOMNAP
  </text>
  <text x="256" y="455" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2.5">
    GLOBAL PARCEL &amp; COMMERCE
  </text>
</svg>