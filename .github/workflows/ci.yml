name: TOMNAP CI / CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Test, Lint & Production Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js ${{ matrix.node-version }} Kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: TypeScript Statik Tip Kontrolü
        run: npx tsc --noEmit

      - name: Production Bundle Derlemesi (Vite + esbuild)
        run: npm run build

      - name: Vitest Birim ve Entegrasyon Testlerini Çalıştır
        run: npm run test:coverage

      - name: Testlerin depo verisini değiştirmediğini doğrula
        run: test -z "$(git status --porcelain -- data public/uploads)"

      - name: Production bağımlılık güvenlik denetimi
        run: npm audit --omit=dev --audit-level=moderate

      - name: Dağıtım Paketi Kontrolü
        run: |
          test -f build/server.cjs || exit 1
          test -f dist/index.html || exit 1
          npm run check:client-artifacts
          echo "✅ Production derlemesi başarıyla doğrulandı."

      # npm run build, v2 bayrağı kapalıyken kabuğun pakette hiç olmadığını denetler.
      - name: v2 kabuğu bayrak açıkken ilk yük paketinin dışında
        run: |
          VITE_FF_V2_FLOW=true npx vite build --outDir "$RUNNER_TEMP/dist-v2" --emptyOutDir
          npm run check:v2-bundle -- "$RUNNER_TEMP/dist-v2" acik

  browser-security:
    name: Chromium UI and authorization acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Install the pinned Chromium runtime
        run: npm run test:e2e:install -- --with-deps
      - name: Build the production UI
        run: npm run build
      - name: Run isolated real-browser security scenarios
        run: npm run test:e2e
      - name: Check repository fixtures remained unchanged
        if: always()
        run: test -z "$(git status --porcelain -- data public/uploads)"
      - name: Preserve synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-security-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  database-security:
    name: PostgreSQL access, transactions and concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: tomnap_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated-ci-only
      PGDATABASE: tomnap_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Synthetic schema, migration and access regression checks
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/base-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase_saas_schema.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/legacy-access-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/storage-fixture.sql
          for migration in supabase/migrations/*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/security-rls.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/inbox-transactions.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/maintenance-transactions.sql
          # Backup columns: the list the export/restore round-trip test relies on.
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/siparis-yedek-kolonlari.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/onboarding-transactions.sql
          # Role catalog (A4) and ABD_SATINALMA (A5); then the role migrations
          # up -> down -> up, and the same tests again on the rebuilt schema.
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/rol-katalogu.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/abd-satinalma.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/rol-migration-roundtrip.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/rol-katalogu.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/abd-satinalma.sql
          # Rates and v2 settings (A7): access, append-only, upsert, up -> down -> up.
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/kurlar-ve-v2-ayarlari.sql
          # Order lines (A8): RPC, trigger, up -> down -> up; then the races, which
          # commit v2 orders (so they run after the round trip).
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/siparis-satirlari.sql
          # Owner rule (O-24): SUPER_ADMIN names the owner, never owns; down -> up.
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/siparis-sahibi-kurali.sql
          node tests/sql/siparis-satirlari-concurrency.mjs
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/cargo-settings.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/courier-access.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/legacy-upload-migrations.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/private-storage.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/list-pagination.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/awb-match-approvals.sql
          node tests/sql/inbox-concurrency.mjs
          node tests/sql/courier-concurrency.mjs
          node tests/sql/list-pagination-concurrency.mjs
          node tests/sql/awb-confirmation-concurrency.mjs
          # AWB migrations: up -> down -> up, then the AWB tests again on the rebuilt schema.
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/awb-migration-roundtrip.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/awb-match-approvals.sql
          node tests/sql/awb-confirmation-concurrency.mjs
