    <script>
      // Defensive shim: Ensure window.fetch has both getter and setter in iframe sandboxes
      (function () {
        try {
          var win = typeof window !== 'undefined' ? window : globalThis;
          var currentFetch = typeof win.fetch === 'function' ? win.fetch.bind(win) : null;
          var desc = Object.getOwnPropertyDescriptor(win, 'fetch');
          if (!desc || !desc.set) {
            Object.defineProperty(win, 'fetch', {
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {
          // Ignore environment restrictions if descriptor is sealed
        }
      })();

      // Suppress benign Vite WebSocket errors in iframe sandbox environment
      (function () {
        try {
          var origError = console.error;
          console.error = function () {
            var first = arguments[0] ? String(arguments[0]) : '';
            if (first.indexOf('[vite]') !== -1) {
              return;
            }
            return origError.apply(console, arguments);
          };
        } catch (e) {}
      })();
    </script>
