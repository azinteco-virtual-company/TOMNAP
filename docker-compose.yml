version: '3.8'

services:
  tomnap-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tomnap-logistics
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_SECRET_KEY=${API_SECRET_KEY:-tomnap_prod_key_degistirin}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - LOG_LEVEL=info
    volumes:
      - tomnap-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/sistem-durum"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  tomnap-uploads:
    driver: local
